lass="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_R_Q_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(185.9609375, 692.265625)"><g class="label" data-id="L_Q_N_0" transform="translate(-8.578125, -11.25)"><foreignObject width="17.15625" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>no</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(579.1015625, 692.265625)"><g class="label" data-id="L_Q_Y_0" transform="translate(-11.7890625, -11.25)"><foreignObject width="23.578125" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>yes</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_Y_Z_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_Z_K_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-S-0" transform="translate(382.53125, 51.75)"><rect class="basic label-container" style="" x="-244.3046875" y="-43.75" width="488.609375" height="87.5"/><g class="label" style="" transform="translate(-224.3046875, -33.75)"><rect/><foreignObject width="448.609375" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>Array.prototype.sort</b> hook — sub_67DEB2, called once, on the<br />28 lap positions. Draws K = 1 + 65534*rand, fills a VecDeque with<br />queue[i] = lapY[i] * K, and sets g2 = sum(queue).</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-M-2" transform="translate(382.53125, 188.5)"><rect class="basic label-container" style="" x="-262.9765625" y="-55" width="525.953125" height="110"/><g class="label" style="" transform="translate(-242.9765625, -45)"><rect/><foreignObject width="485.953125" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>Math.min</b> hook — sub_67EB83, called once per lap from<br />Math.min(bestLapSeconds, lapSecs). Pops q_i from the queue, pushes<br />trunc(lapSecs) into a byte Vec, and adds<br />g1 += q_i * sin((A_i + trunc(lapSecs)) degrees).</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-R-4" transform="translate(382.53125, 314)"><rect class="basic label-container" style="" x="-193.5" y="-32.5" width="387" height="65"/><g class="label" style="" transform="translate(-173.5, -22.5)"><rect/><foreignObject width="347" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>String.prototype.replaceAll</b> hook — sub_67E81E,<br />called once, on the finished flag string</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Q-6" transform="translate(382.53125, 523.2578125)"><polygon points="138.7578125,0 277.515625,-138.7578125 138.7578125,-277.515625 0,-138.7578125" class="label-container" transform="translate(-138.2578125, 138.7578125)"/><g class="label" style="" transform="translate(-106.2578125, -22.5)"><rect/><foreignObject width="212.515625" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>abs(g1) &gt; 1e-6, abs(g2) &gt; 1e-6,<br />and abs(g1 - g2) &lt; 1e-6 ?</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-N-8" transform="translate(185.9609375, 755.015625)"><rect class="basic label-container" style="fill:#fde8e8 !important;stroke:#d93025 !important" x="-177.9609375" y="-32.5" width="355.921875" height="65"/><g class="label" style="" transform="translate(-157.9609375, -22.5)"><rect/><foreignObject width="315.921875" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>plain replaceAll — you get the decoy:<br />decode_this_system_to_win_it@f1are-on.com</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Y-10" transform="translate(579.1015625, 755.015625)"><rect class="basic label-container" style="" x="-183.1796875" y="-32.5" width="366.359375" height="65"/><g class="label" style="" transform="translate(-163.1796875, -22.5)"><rect/><foreignObject width="326.359375" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>overwrite the string with the collected byte Vec,<br />then byte[30] += 0x3B</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Z-12" transform="translate(579.1015625, 846.765625)"><rect class="basic label-container" style="fill:#dff5e1 !important;stroke:#2f9e44 !important;stroke-width:2px !important" x="-193.46875" y="-21.25" width="386.9375" height="42.5"/><g class="label" style="" transform="translate(-173.46875, -11.25)"><rect/><foreignObject width="346.9375" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>R3_ag3nt_4b0ut_t0_f33l_d1zzy@flare-on.com</b></p></span></div></foreignObject></g></g><g class="node default" id="flowchart-K-14" transform="translate(579.1015625, 983.515625)"><rect class="basic label-container" style="fill:#fff8e6 !important;stroke:#c9a227 !important" x="-255.7109375" y="-77.5" width="511.421875" height="155"/><g class="label" style="" transform="translate(-235.7109375, -67.5)"><rect/><foreignObject width="471.421875" height="135"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>Why this is solvable at all.</b> g2 is <i>exactly</i> the sum of the q_i, so<br />g1 == g2 forces sin(...) == 1 for every single lap — the terms cannot<br />trade off against each other, and each lap time is pinned individually.<br />The string the hook emits <i>is</i> the byte Vec, so the flag is the sequence<br />of lap times. And 0x31 + 0x3B = 0x6C, i.e. '1' becomes 'l' — which is<br />why the decoy ships a deliberately broken domain.</p></span></div></foreignObject></g></g></g></g></g></svg>