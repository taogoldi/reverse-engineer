els"><g class="edgeLabel"><g class="label" data-id="L_A_B_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(78.46875, 544.3125)"><g class="label" data-id="L_B_X_0" transform="translate(-43.8046875, -11.25)"><foreignObject width="87.609375" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>0 — left click</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(379.7265625, 396.3125)"><g class="label" data-id="L_B_C_0" transform="translate(-48.2890625, -11.25)"><foreignObject width="96.578125" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>2 — right click</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_C_D_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(235.29147, 820.7586)"><g class="label" data-id="L_D_X_0" transform="translate(-66.125, -11.25)"><foreignObject width="132.25" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>yes — cancelHold()</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(464.71875, 844.515625)"><g class="label" data-id="L_D_E_0" transform="translate(-83.859375, -11.25)"><foreignObject width="167.71875" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>no — timer fires after 2 s</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_E_I_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_I_K_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-A-0" transform="translate(293.125, 29.25)"><rect class="basic label-container" style="" x="-143.0625" y="-21.25" width="286.125" height="42.5"/><g class="label" style="" transform="translate(-123.0625, -11.25)"><rect/><foreignObject width="246.125" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>mousedown on #rc-interactive-area</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B-1" transform="translate(293.125, 227.28125)"><polygon points="138.78125,0 277.5625,-138.78125 138.78125,-277.5625 0,-138.78125" class="label-container" transform="translate(-138.28125, 138.78125)"/><g class="label" style="" transform="translate(-106.28125, -22.5)"><rect/><foreignObject width="212.5625" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>e.button ===<br />Math.pow(5,0) + Math.pow(1,1)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-X-3" transform="translate(121.53125, 941.015625)"><rect class="basic label-container" style="fill:#fde8e8 !important;stroke:#d93025 !important" x="-113.53125" y="-43.75" width="227.0625" height="87.5"/><g class="label" style="" transform="translate(-93.53125, -33.75)"><rect/><foreignObject width="187.0625" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>spinner 1s, then a red X:<br />'Robot, or unskilled<br />reverse engineer detected.'</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-C-5" transform="translate(379.7265625, 470.3125)"><rect class="basic label-container" style="" x="-129.1015625" y="-43.75" width="258.203125" height="87.5"/><g class="label" style="" transform="translate(-109.1015625, -33.75)"><rect/><foreignObject width="218.203125" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>isVerifying = true<br />errorLogStartTime = Date.now()<br />arm a 2000 ms timer</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D-7" transform="translate(379.7265625, 694.4140625)"><polygon points="119.8515625,0 239.703125,-119.8515625 119.8515625,-239.703125 0,-119.8515625" class="label-container" transform="translate(-119.3515625, 119.8515625)"/><g class="label" style="" transform="translate(-76.1015625, -33.75)"><rect/><foreignObject width="152.203125" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>mouseup button 2,<br />or mouseleave, before<br />the timer fires?</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E-11" transform="translate(464.71875, 941.015625)"><rect class="basic label-container" style="fill:#fff8e6 !important;stroke:#c9a227 !important" x="-197.65625" y="-66.25" width="395.3125" height="132.5"/><g class="label" style="" transform="translate(-177.65625, -56.25)"><rect/><foreignObject width="355.3125" height="112.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>held = 2000 ms, so:</b><br />displayPaddingPx = round(2000/1000) = 2<br />widgetLength = resetWidget.toString().length = 222<br />x = (2 * (222 + 1115)) &amp; 0xFFFF = 0x0A72<br />wupperLeft = 0x0A · wupperRight = 0x72</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-I-13" transform="translate(464.71875, 1100.265625)"><rect class="basic label-container" style="" x="-168.2890625" y="-55" width="336.578125" height="110"/><g class="label" style="" transform="translate(-148.2890625, -45)"><rect/><foreignObject width="296.578125" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>for each of the 30 bitmap bytes:<br />the Proxy getter XORs with 5<br />(document.characterSet.length),<br />then XOR 0x0A on even index, 0x72 on odd</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-K-15" transform="translate(464.71875, 1214.515625)"><rect class="basic label-container" style="fill:#dff5e1 !important;stroke:#2f9e44 !important;stroke-width:2px !important" x="-139.8984375" y="-21.25" width="279.796875" height="42.5"/><g class="label" style="" transform="translate(-119.8984375, -11.25)"><rect/><foreignObject width="239.796875" height="22.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>triskaidekaphobia@flare-on.com</b></p></span></div></foreignObject></g></g></g></g></g></svg>