/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_G_H_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_G_I_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_I_J_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-A-0" transform="translate(306.546875, 40.5)"><rect class="basic label-container" style="" x="-157.7109375" y="-32.5" width="315.421875" height="65"/><g class="label" style="" transform="translate(-137.7109375, -22.5)"><rect/><foreignObject width="275.421875" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>capture.pcapng — 2810 packets, 15 MB,<br />plain HTTP to 192.168.56.102:8080</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B-1" transform="translate(306.546875, 143.5)"><rect class="basic label-container" style="" x="-149.6484375" y="-32.5" width="299.296875" height="65"/><g class="label" style="" transform="translate(-129.6484375, -22.5)"><rect/><foreignObject width="259.296875" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>reassemble TCP by sequence number<br />-&gt; six POST bodies to /exfil</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-C-3" transform="translate(306.546875, 246.5)"><rect class="basic label-container" style="" x="-127.1640625" y="-32.5" width="254.328125" height="65"/><g class="label" style="" transform="translate(-107.1640625, -22.5)"><rect/><foreignObject width="214.328125" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>body 0: 264 bytes (handshake)<br />bodies 1-5: 2.7-3.1 MB each</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D-5" transform="translate(306.546875, 360.75)"><rect class="basic label-container" style="" x="-141.03125" y="-43.75" width="282.0625" height="87.5"/><g class="label" style="" transform="translate(-121.03125, -33.75)"><rect/><foreignObject width="242.0625" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>layer 1 — RC4</b>, 25-byte key<br />i11_b3_p1und3r1n_y3r_d474<br />(three immediates, then XOR 0x33)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E-7" transform="translate(306.546875, 486.25)"><rect class="basic label-container" style="" x="-164.21875" y="-43.75" width="328.4375" height="87.5"/><g class="label" style="" transform="translate(-144.21875, -33.75)"><rect/><foreignObject width="288.4375" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>layer 2 — ASCII bit-string container</b><br />one literal '0' or '1' character per bit,<br />repacked 8 characters to a byte, MSB first</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-9" transform="translate(306.546875, 623)"><rect class="basic label-container" style="" x="-147.5625" y="-55" width="295.125" height="110"/><g class="label" style="" transform="translate(-127.5625, -45)"><rect/><foreignObject width="255.125" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>unpack the header:<br />11 bits = code-length table size (256)<br />32 bits = Huffman bitstream length<br />then the table, then the data</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-11" transform="translate(306.546875, 759.75)"><rect class="basic label-container" style="" x="-161.3671875" y="-43.75" width="322.734375" height="87.5"/><g class="label" style="" transform="translate(-141.3671875, -33.75)"><rect/><foreignObject width="282.734375" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>layer 3 — canonical Huffman</b><br />sort by (length, symbol), code starts at 0,<br />code = (code + 1) &lt;&lt; (len - prev_len)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-H-13" transform="translate(148.515625, 885.25)"><rect class="basic label-container" style="fill:#fff8e6 !important;stroke:#c9a227 !important" x="-140.515625" y="-43.75" width="281.03125" height="87.5"/><g class="label" style="" transform="translate(-120.515625, -33.75)"><rect/><foreignObject width="241.03125" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>body 0 decodes to <b>READY</b><br />— 5 symbols, Kraft sum exactly 1.0,<br />which is what proved the model</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-I-15" transform="translate(464.578125, 885.25)"><rect class="basic label-container" style="" x="-143.546875" y="-43.75" width="287.09375" height="87.5"/><g class="label" style="" transform="translate(-123.546875, -33.75)"><rect/><foreignObject width="247.09375" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>bodies 1-5 decode to<br />FF D8 FF E0 .. JFIF<br />five 2816x1536 JPEGs of pirate cats</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-J-17" transform="translate(464.578125, 999.5)"><rect class="basic label-container" style="fill:#dff5e1 !important;stroke:#2f9e44 !important;stroke-width:2px !important" x="-200.9140625" y="-32.5" width="401.828125" height="65"/><g class="label" style="" transform="translate(-180.9140625, -22.5)"><rect/><foreignObject width="361.828125" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>image 4: a scroll on a crate reads<br /><b>th3r3_b3_tr34sure_1n_th4t_pc4p@flare-on.com</b></p></span></div></foreignObject></g></g></g></g></g></svg>