zU2OTcsInkiOjY0Mi41fSx7IngiOjE3Ni41MDc4MTI1LCJ5Ijo2NjEuNX0seyJ4IjoxNzYuNTA3ODEyNSwieSI6NjkxLjc1fV0=" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M538.61,642.5L549.377,645.667C560.144,648.833,581.677,655.167,592.444,660.833C603.211,666.5,603.211,671.5,603.211,674L603.211,676.5" id="L_E_G_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_E_G_0" data-points="W3sieCI6NTM4LjYxMDQ2NDM5MjQzMDIsInkiOjY0Mi41fSx7IngiOjYwMy4yMTA5Mzc1LCJ5Ijo2NjEuNX0seyJ4Ijo2MDMuMjEwOTM3NSwieSI6NjgwLjV9XQ==" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_A_B_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_B_C_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_C_D_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_D_E_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_E_F_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_E_G_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-A-0" transform="translate(389.859375, 63)"><rect class="basic label-container" style="" x="-247.703125" y="-55" width="495.40625" height="110"/><g class="label" style="" transform="translate(-227.703125, -45)"><rect/><foreignObject width="455.40625" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>neon_outrun</b> — 21 MB stripped Linux x86-64 PIE.<br />NEEDED: libwebkit2gtk-4.1, libgtk-3, libsoup-3.0 — a <b>Tauri v2</b> app.<br />Plus an entire statically linked <b>V8</b> (rusty_v8 9.5.172.19), which is<br />where 15 MB of .text and 2 MB of V8 strings come from.</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B-2" transform="translate(389.859375, 199.75)"><rect class="basic label-container" style="" x="-251.53125" y="-43.75" width="503.0625" height="87.5"/><g class="label" style="" transform="translate(-231.53125, -33.75)"><rect/><foreignObject width="463.0625" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>front end: a phf map of brotli-compressed assets. Found by walking<br />.data.rel.ro relocations for (ptr, len) pairs whose target is an ASCII<br />path: /index.html /car.png /tree.png /lap.png /obstacle.png</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-C-4" transform="translate(389.859375, 325.25)"><rect class="basic label-container" style="" x="-236.6171875" y="-43.75" width="473.234375" height="87.5"/><g class="label" style="" transform="translate(-216.6171875, -33.75)"><rect/><foreignObject width="433.234375" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>index.html — a canvas racing game. Once per frame it sends<br />{up,down,left,right,restart,bounds} to invoke('plugin:neon|e', ...)<br />and renders the reply.</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D-6" transform="translate(389.859375, 462)"><rect class="basic label-container" style="" x="-240.0234375" y="-55" width="480.046875" height="110"/><g class="label" style="" transform="translate(-220.0234375, -45)"><rect/><foreignObject width="440.046875" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>Rust command handler -&gt; V8 isolate: tick(input_json)<br />-&gt; JSON {carRatio, bestLapSeconds, ...} -&gt; back to the canvas.<br /><i>None of those field names appear anywhere in the 21 MB binary,<br />so V8 is building the JSON, not Rust.</i></p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E-8" transform="translate(389.859375, 598.75)"><rect class="basic label-container" style="" x="-257.421875" y="-43.75" width="514.84375" height="87.5"/><g class="label" style="" transform="translate(-237.421875, -33.75)"><rect/><foreignObject width="474.84375" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>sub_688C64</b> — 16,848 bytes, control-flow flattened, reached from<br />main through an 8-byte thunk. The only function that references both<br />the rusty_v8 panic strings and 'zstd returned null pointer...'.</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-10" transform="translate(176.5078125, 724.25)"><rect class="basic label-container" style="" x="-168.5078125" y="-32.5" width="337.015625" height="65"/><g class="label" style="" transform="translate(-148.5078125, -22.5)"><rect/><foreignObject width="297.015625" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>unpacks the 4,229-byte game script from a<br />1,942-byte blob at .rodata:0x21DB73</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-12" transform="translate(603.2109375, 724.25)"><rect class="basic label-container" style="fill:#fff8e6 !important;stroke:#c9a227 !important" x="-226.1953125" y="-43.75" width="452.390625" height="87.5"/><g class="label" style="" transform="translate(-206.1953125, -33.75)"><rect/><foreignObject width="412.390625" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p><b>and, before the script ever runs,</b> replaces three JavaScript<br />builtins with native Rust callbacks:<br />Array.prototype.sort · Math.min · String.prototype.replaceAll</p></span></div></foreignObject></g></g></g></g></g></svg>